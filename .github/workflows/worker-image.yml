name: Worker image

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Image tag to publish
        type: string
        required: true
        default: latest
      is_stable:
        description: Also update latest when publishing a version tag
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      is_stable:
        type: boolean
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag."
            exit 1
          fi

  docker-worker-build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute worker image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-task-worker
          labels: |
            org.opencontainers.image.title=Multica Task Worker
            org.opencontainers.image.description=Multica Docker-isolated task worker

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/task-worker/Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-worker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-worker-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ inputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/multica-task-worker,push-by-digest=true,name-canonical=true,push=true

      - name: Smoke-test worker image
        env:
          WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/multica-task-worker
          WORKER_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "$WORKER_IMAGE@$WORKER_DIGEST" multica --version

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-worker-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-worker-merge:
    needs: [validate, docker-worker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-worker-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute worker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-task-worker
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.is_stable }}
            type=raw,value=${{ inputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=(*)
          image_refs=("${digests[@]/#/ghcr.io/${{ github.repository_owner }}/multica-task-worker@sha256:}")
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/multica-task-worker:${{ steps.meta.outputs.version }}

